<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slonimsky Thesaurus Lab</title>
  <meta name="description" content="Slonimsky's Thesaurus of Scales and Melodic Patterns, reconstructed algorithmically: browse, hear, build and test patterns." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230f6e6e' stroke-width='2.5'/%3E%3Cpath d='M16 3 27.3 22.5 4.7 22.5Z' fill='none' stroke='%230f6e6e' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/thesaurus" aria-label="Slonimsky Thesaurus Lab home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" />
        <path d="M16 3 27.3 22.5 4.7 22.5Z" />
      </svg>
      <span class="brand-text"><strong>Slonimsky</strong><em>Thesaurus Lab</em></span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a href="#/thesaurus" data-view="thesaurus">Thesaurus</a>
      <a href="#/builder" data-view="builder">Builder</a>
      <a href="#/research" data-view="research">Research</a>
      <a href="#/about" data-view="about">About</a>
    </nav>
    <div class="top-actions">
      <label class="select-inline" title="Accidentals">
        <span class="sr-only">Accidentals</span>
        <select id="spelling">
          <option value="auto">Auto ♯/♭</option>
          <option value="sharps">Sharps ♯</option>
          <option value="flats">Flats ♭</option>
        </select>
      </label>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <div class="loading">Loading the thesaurus…</div>
  </main>

  <script src="vendor/abcjs-basic-min.js"></script>
  <script src="engine.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
